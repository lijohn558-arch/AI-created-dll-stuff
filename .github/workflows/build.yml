name: build

on:
  push:
  workflow_dispatch:

jobs:
  capture-helper:
    name: capture-helper (SKSE plugin)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Locate MSVC (x64)
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found" }
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw "MSVC x64 toolset not found" }
          $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvars64.bat"
          if (-not (Test-Path $vcvars)) { throw "vcvars64.bat not found: $vcvars" }
          "VCVARS=$vcvars" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Using MSVC env: $vcvars"

      - name: Compile capture-helper.dll
        shell: cmd
        run: |
          call "%VCVARS%"
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /utf-8 /EHsc /O2 /MD /LD src\capture-helper\main.cpp /Fe:capture-helper.dll
          if errorlevel 1 exit /b 1

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: capture-helper
          path: capture-helper.dll
          if-no-files-found: error

  poc-presenter:
    name: poc-presenter (SKSE plugin, PoC-A Present hook)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Checkout Vulkan-Headers (PoC-B 用, 本机/CI 都无 Vulkan SDK)
        uses: actions/checkout@v5
        with:
          repository: KhronosGroup/Vulkan-Headers
          path: third_party/Vulkan-Headers

      - name: Locate MSVC (x64)
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found" }
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw "MSVC x64 toolset not found" }
          $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvars64.bat"
          if (-not (Test-Path $vcvars)) { throw "vcvars64.bat not found: $vcvars" }
          "VCVARS=$vcvars" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Using MSVC env: $vcvars"

      - name: Compile poc-presenter.dll
        shell: cmd
        run: |
          call "%VCVARS%"
          if errorlevel 1 exit /b 1
          if not exist third_party\Vulkan-Headers\include\vulkan\vulkan.h (
            echo ::error::Vulkan-Headers 未就位, 缺 third_party\Vulkan-Headers\include\vulkan\vulkan.h
            exit /b 1
          )
          cl /nologo /std:c++17 /utf-8 /EHsc /O2 /MD /LD /I third_party\Vulkan-Headers\include src\poc-presenter\main.cpp /Fe:poc-presenter.dll user32.lib > cl_poc.log 2>&1
          set CLRC=%ERRORLEVEL%
          type cl_poc.log
          powershell -NoProfile -Command "Get-Content cl_poc.log | ForEach-Object { if ($_ -like '*error*') { Write-Output ('::error::' + $_) } }"
          exit /b %CLRC%

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: poc-presenter
          path: poc-presenter.dll
          if-no-files-found: error
